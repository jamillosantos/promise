name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }}, GOMAXPROCS=${{ matrix.gomaxprocs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (go.mod directive) and current stable.
        go: ["1.22", "stable"]
        # Vary the scheduler: single-threaded vs multi-core exposes
        # ordering assumptions the race detector alone cannot.
        gomaxprocs: ["1", "4"]
    env:
      GOMAXPROCS: ${{ matrix.gomaxprocs }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Run tests with coverage
        run: go test -race -count=1 -covermode=atomic -coverprofile=cover.out ./...

      - name: Coverage report and gate
        env:
          # Fail the job if total statement coverage drops below this.
          THRESHOLD: "90"
        run: |
          go tool cover -func=cover.out | tee coverage.txt
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/, "", $3); print $3}')
          echo "Total coverage: ${total}%"
          {
            echo "### Coverage: ${total}%"
            echo ""
            echo '```'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" -v min="$THRESHOLD" 'BEGIN { exit (t+0 < min+0) ? 1 : 0 }' \
            || { echo "::error::coverage ${total}% is below threshold ${THRESHOLD}%"; exit 1; }

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            cover.out
            coverage.txt
          retention-days: 14
